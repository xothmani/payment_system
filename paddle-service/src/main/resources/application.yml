server:
  port: 8094

spring:
  application:
    name: paddle-service

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

paddle:
  api-key: ${PADDLE_API_KEY}
  webhook-secret: ${PADDLE_WEBHOOK_SECRET}
  base-url: https://sandbox-api.paddle.com
  success-url: ${PADDLE_SUCCESS_URL:http://localhost:3000/payment/success}
  cancel-url: ${PADDLE_CANCEL_URL:http://localhost:3000/payment/cancel}

subscription:
  service:
    url: ${SUBSCRIPTION_SERVICE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      gatewayCircuitBreaker:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-calls-in-half-open-state: 3
  retry:
    instances:
      gatewayRetry:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - java.net.ConnectException
