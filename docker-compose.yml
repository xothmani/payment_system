services:

  # ─── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: payment-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: payment-redis
    command: redis-server
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Microservices ─────────────────────────────────────────────────────────

  subscription-service:
    build:
      context: .
      dockerfile: subscription-service/Dockerfile
    container_name: subscription-service
    ports:
      - "8091:8091"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-router:
    build:
      context: .
      dockerfile: payment-router/Dockerfile
    container_name: payment-router
    ports:
      - "8092:8092"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      authorize-net-service:
        condition: service_started
      paddle-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8092/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  authorize-net-service:
    build:
      context: .
      dockerfile: authorize-net-service/Dockerfile
    container_name: authorize-net-service
    ports:
      - "8093:8093"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8093/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  paddle-service:
    build:
      context: .
      dockerfile: paddle-service/Dockerfile
    container_name: paddle-service
    ports:
      - "8094:8094"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8094/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
