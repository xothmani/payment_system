server:
  port: 8091

spring:
  application:
    name: subscription-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:sandbox}

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    show-sql: false
    open-in-view: false

  sql:
    init:
      mode: always

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

payment:
  router:
    url: ${PAYMENT_ROUTER_URL}

paddle:
  service:
    url: ${PADDLE_SERVICE_URL}

admin:
  key: ${ADMIN_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
